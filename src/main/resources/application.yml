spring:
  application:
    name: campuslife
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campuslife?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED}
    username: ${DB_USER:campuslife}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 3000
      connection-init-sql: SET time_zone = '+00:00'
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: campuslife
app:
  redis-prefix: 'campuslife:dev:'
  auth:
    dev-code-enabled: false
logging:
  pattern:
    level: '%5p [requestId:%X{requestId:-}]'
springdoc:
  swagger-ui:
    path: /docs
